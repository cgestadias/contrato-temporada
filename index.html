<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gerador de Contrato de Temporada</title>
<style>
  :root{
    --bg:#f3f1ec; --panel:#ffffff; --ink:#1d1f22; --muted:#6b6f76; --line:#e3e0d8;
    --accent:#1f4e5f; --accent-2:#2f6f85; --warn:#a4561a; --warn-bg:#fbf0e6; --ok:#2f6b3a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
  header h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.2px}
  @media (max-width:700px){header{position:static} header h1{font-size:15px;flex-basis:100%} header .sp{display:none}}
  header .sp{flex:1}
  button,.btn{font:inherit;border:1px solid var(--line);background:#fff;color:var(--ink);padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
  button:hover{border-color:#cfcac0}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{background:var(--accent-2)}
  button.small{padding:4px 9px;font-size:12.5px}
  button.danger{color:#9b2c2c}
  main{display:grid;grid-template-columns:minmax(360px,470px) 1fr;gap:20px;padding:20px;max-width:1500px;margin:0 auto}
  @media (max-width:980px){main{grid-template-columns:1fr}}
  .form{display:flex;flex-direction:column;gap:14px}
  details{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:0 16px}
  details[open]{padding-bottom:14px}
  summary{cursor:pointer;list-style:none;padding:13px 0;font-weight:620;display:flex;align-items:center;gap:8px}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"›";display:inline-block;transition:transform .15s;color:var(--muted);font-size:18px;line-height:1}
  details[open] summary::before{transform:rotate(90deg)}
  summary .hint{font-weight:400;color:var(--muted);font-size:12.5px;margin-left:auto}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
  .grid .full{grid-column:1/-1}
  label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
  input,select,textarea{font:inherit;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff;width:100%}
  input:focus,select:focus,textarea:focus{outline:2px solid #bcd3db;border-color:var(--accent-2)}
  textarea{resize:vertical;min-height:70px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .calc{background:#f6f8f8;border:1px dashed #c9d7dc;border-radius:8px;padding:8px 10px;font-size:12.5px;color:#33454c}
  .calc b{color:var(--ink)}
  .issues{background:var(--warn-bg);color:var(--warn);border:1px solid #f0d6bf;border-radius:10px;padding:10px 14px;font-size:13px}
  .issues ul{margin:4px 0 0 18px;padding:0}
  .issues.ok{background:#eef6ef;color:var(--ok);border-color:#cfe5d2}
  .previewWrap{position:sticky;top:76px;align-self:start;max-height:calc(100vh - 96px);overflow:auto;border-radius:12px}
  @media (max-width:980px){.previewWrap{position:static;max-height:none}}
  .paper{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08),0 8px 30px rgba(0,0,0,.06);margin:0 auto;max-width:820px;padding:56px 64px 64px;font-family:"Times New Roman",Times,serif;font-size:16px;line-height:1.38;color:#111}
  @media (max-width:600px){.paper{padding:28px 22px}}
  .paper .logo{display:block;margin:0 auto 6px;width:96px;height:auto}
  .paper h2{font-weight:400;font-size:17px;text-align:center;margin:6px 0 18px;letter-spacing:.2px}
  .paper p{margin:0 0 14px;text-align:justify}
  .paper p.intro{text-indent:3.2em}
  .paper p.h{text-align:left}
  .paper p.par{margin:0}
  .paper p.par.last{margin-bottom:14px}
  .paper .art{display:block}
  .paper .lab{display:inline-block;min-width:6.1em}
  .paper p.right{text-align:right;margin-top:6px}
  .paper .sign{text-align:center;margin-top:34px}
  .paper .sign img{display:block;margin:0 auto -10px;max-height:70px;max-width:260px}
  .paper .sign .ln{display:block;width:62%;margin:0 auto 4px;border-top:1px solid #333}
  .paper mark{background:#fff3c4;color:inherit;padding:0 2px;border-radius:2px}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:9px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;max-width:90vw}
  .toast.show{opacity:1}
  .muted{color:var(--muted);font-size:12.5px}
  .thumb{max-height:46px;max-width:140px;border:1px solid var(--line);border-radius:6px;background:#fff;padding:2px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{border:0;border-radius:0;padding:6px 10px}
  .seg button.on{background:var(--accent);color:#fff}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:30}
  .modal.show{display:flex}
  .modal .box{background:#fff;border-radius:12px;padding:18px;max-width:380px;width:92%}
  .modal .box h3{margin:0 0 8px;font-size:15px}
</style>
</head>
<body>
<header>
  <h1>Gerador de Contrato de Locação por Temporada</h1>
  <span class="sp"></span>
  <button id="btnNovo" title="Limpa os dados do locatário, datas e valores; mantém locador e imóvel">Novo contrato</button>
  <button id="btnCopiar">Copiar texto</button>
  <button id="btnDocx" class="primary">Baixar Word (.docx)</button>
  <button id="btnPdf" class="primary">Baixar PDF</button>
</header>

<main>
<section class="form" id="form">

  <div id="issues" class="issues"></div>

  <details open>
    <summary>Locatário (hóspede) <span class="hint">muda a cada contrato</span></summary>
    <div class="grid">
      <label class="full">Nome completo<input data-k="lt_nome" placeholder="Nome do locatário"></label>
      <label>Gênero (concordância)<select data-k="lt_g"><option value="M">Masculino</option><option value="F">Feminino</option></select></label>
      <label>Nacionalidade<input data-k="lt_nac" placeholder="brasileiro"></label>
      <label>Estado civil<input data-k="lt_ec" placeholder="opcional"></label>
      <label>Profissão<input data-k="lt_prof" placeholder="advogado"></label>
      <label>CPF<input data-k="lt_cpf" data-mask="cpf" inputmode="numeric" placeholder="000.000.000-00"></label>
      <label>Telefone<input data-k="lt_tel" placeholder="+55 83 99999-9999"></label>
      <label class="full">Endereço<input data-k="lt_end" placeholder="Rua, nº - Bairro, Cidade-UF"></label>
    </div>
  </details>

  <details open>
    <summary>Imóvel <span class="hint" id="imHint"></span></summary>
    <div class="row" style="margin-bottom:10px">
      <select id="presetSel" style="flex:1;min-width:160px"><option value="">— imóveis salvos —</option></select>
      <button class="small" id="presetSave">Salvar imóvel</button>
      <button class="small danger" id="presetDel">Excluir</button>
    </div>
    <div class="grid">
      <label class="full">Endereço do imóvel<textarea data-k="im_endereco" rows="2" placeholder="Rua/Av., nº - Bairro - apto, Condomínio, Cidade-UF"></textarea></label>
      <label class="full">Nome do imóvel / condomínio <span style="font-weight:400">(usado no nome do arquivo)</span><input data-k="im_cond" placeholder="Ex.: Edifício Mar Azul"></label>
      <label class="full">Identificação da unidade (Art. 12)<input data-k="im_unidade" placeholder="Apto de unidade 401"></label>
      <label class="full">Itens que guarnecem o imóvel (Art. 12)<textarea data-k="im_itens" rows="5"></textarea></label>
      <label>Foro (cidade)<input data-k="foro"></label>
      <label>Local da assinatura<input data-k="ass_local" placeholder="João Pessoa - PB"></label>
    </div>
  </details>

  <details open>
    <summary>Período e valores</summary>
    <div class="grid">
      <label>Check-in<input type="date" data-k="ci"></label>
      <label>Check-out<input type="date" data-k="co"></label>
      <label>Horário de check-in<input type="time" data-k="hora_ci" title="Opcional — deixe vazio para não constar"></label>
      <label>Horário de check-out<input type="time" data-k="hora_co"></label>
      <label>Valor da diária (R$)<input data-k="diaria" data-money inputmode="decimal" placeholder="0,00"></label>
      <label>Valor total (R$)<input data-k="total" data-money inputmode="decimal" placeholder="0,00"></label>
      <label>Sinal na reserva (%)<input type="number" min="0" max="100" step="1" data-k="pct"></label>
      <label>Data do pagamento restante<input type="date" data-k="data_rest" title="Vazio = data do check-in"></label>
      <div class="full calc" id="calc"></div>
    </div>
  </details>


  <details open>
    <summary>Locador e pagamento <span class="hint">fica salvo neste navegador</span></summary>
    <div class="grid">
      <label class="full">Nome completo<input data-k="loc_nome"></label>
      <label>Gênero (concordância)<select data-k="loc_g"><option value="M">Masculino</option><option value="F">Feminino</option></select></label>
      <label>Nacionalidade<input data-k="loc_nac"></label>
      <label>Estado civil<input data-k="loc_ec"></label>
      <label>Profissão<input data-k="loc_prof"></label>
      <label>CPF<input data-k="loc_cpf" data-mask="cpf" inputmode="numeric" placeholder="000.000.000-00"></label>
      <label>Telefone<input data-k="loc_tel" placeholder="opcional"></label>
      <label class="full">Endereço<input data-k="loc_end"></label>
      <label>Tipo da chave Pix<select data-k="pix_tipo"><option>e-mail</option><option>CPF</option><option>CNPJ</option><option>telefone</option><option>chave aleatória</option></select></label>
      <label>Chave Pix<input data-k="pix_chave"></label>
      <label>Titular da conta<input data-k="pix_titular"></label>
      <label>Banco<input data-k="pix_banco"></label>
    </div>
  </details>

  <details>
    <summary>Documento</summary>
    <div class="grid">
      <label>Data da assinatura<input type="date" data-k="ass_data"></label>
      <label>Logomarca no topo<select data-k="showLogo"><option value="1">Mostrar</option><option value="0">Não mostrar</option></select></label>
      <div class="full row">
        <img id="logoThumb" class="thumb" alt="" hidden>
        <label class="btn" style="flex-direction:row;color:var(--ink);font-size:13px">Trocar logomarca<input type="file" accept="image/png,image/jpeg" id="logoFile" hidden></label>
        <button class="small" id="logoReset">Logo padrão</button>
      </div>
      <div class="full row">
        <img id="sigThumb" class="thumb" alt="" hidden>
        <label class="btn" style="flex-direction:row;color:var(--ink);font-size:13px">Assinatura do locador (imagem)<input type="file" accept="image/png,image/jpeg" id="sigFile" hidden></label>
        <button class="small danger" id="sigDel" hidden>Remover</button>
      </div>
      <div class="full muted">A imagem da assinatura é opcional; use um PNG com fundo transparente. Fica salva só neste navegador.</div>
      <label class="full">Cláusulas adicionais (uma por linha — viram artigos antes do foro)<textarea data-k="extras" rows="3" placeholder="Ex.: É permitida a hospedagem de no máximo 3 (três) pessoas;"></textarea></label>
      <label class="full" style="flex-direction:row;align-items:center;gap:8px;color:var(--ink)"><input type="checkbox" id="hl" style="width:auto"> Destacar na pré-visualização os campos preenchidos</label>
    </div>
  </details>

</section>

<section class="previewWrap">
  <div class="paper" id="paper"></div>
</section>
</main>

<div class="modal" id="modal"><div class="box">
  <h3 id="mTitle"></h3>
  <div id="mBody" class="muted" style="margin-bottom:10px"></div>
  <input id="mInput" style="margin-bottom:12px">
  <div class="row" style="justify-content:flex-end"><button id="mCancel">Cancelar</button><button id="mOk" class="primary">OK</button></div>
</div></div>
<div class="toast" id="toast"></div>

function migrate(o){ // dados salvos na versão anterior (endereço em partes)

}

/* ---------- formatting helpers ---------- */
function todayISO(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
const MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
function parseISO(s){ if(!s) return null; const [y,m,d]=s.split("-").map(Number); if(!y||!m||!d) return null; return {y,m,d}; }
function dataExtenso(s){ const p=parseISO(s); if(!p) return ""; return (p.d===1?"1º":p.d)+" de "+MESES[p.m-1]+" de "+p.y; }
function dataCurta(s){ const p=parseISO(s); if(!p) return ""; return String(p.d).padStart(2,"0")+" "+MESES[p.m-1].slice(0,3); }
function noites(ci,co){ const a=parseISO(ci), b=parseISO(co); if(!a||!b) return 0; return Math.round((Date.UTC(b.y,b.m-1,b.d)-Date.UTC(a.y,a.m-1,a.d))/86400000); }
function hora(t){ if(!t) return ""; const [h,m]=t.split(":"); const hh=Number(h); if(m==="00") return hh+(hh===1?" hora":" horas"); return hh+"h"+m; }
function parseMoney(s){ if(s==null) return NaN; s=String(s).trim().replace(/[R$\s]/g,""); if(!s) return NaN;
  if(s.includes(",")) s=s.replace(/\./g,"").replace(",","."); return Number(s); }
function fmtMoney(n){ return n.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtCPF(v){ const d=v.replace(/\D/g,"").slice(0,11); let o=d.slice(0,3); if(d.length>3)o+="."+d.slice(3,6); if(d.length>6)o+="."+d.slice(6,9); if(d.length>9)o+="-"+d.slice(9); return o; }

/* ---------- números por extenso ---------- */
const UN = ["zero","um","dois","três","quatro","cinco","seis","sete","oito","nove","dez","onze","doze","treze","catorze","quinze","dezesseis","dezessete","dezoito","dezenove"];
const DZ = ["","","vinte","trinta","quarenta","cinquenta","sessenta","setenta","oitenta","noventa"];
const CT = ["","cento","duzentos","trezentos","quatrocentos","quinhentos","seiscentos","setecentos","oitocentos","novecentos"];
function ate999(n, fem){
  if(n===0) return "";
  if(n===100) return "cem";
  const c=Math.floor(n/100), r=n%100, parts=[];
  if(c){ let w=CT[c]; if(fem && c>1) w=w.replace(/os$/,"as"); parts.push(w); }
  if(r){
    if(r<20){ let w=UN[r]; if(fem){ if(r===1)w="uma"; if(r===2)w="duas"; } parts.push(w); }
    else { const d=Math.floor(r/10), u=r%10; let w=DZ[d]; if(u){ let uw=UN[u]; if(fem){ if(u===1)uw="uma"; if(u===2)uw="duas"; } w+=" e "+uw; } parts.push(w); }
  }
  return parts.join(" e ");
}
function extenso(n, fem){
  n=Math.floor(n); if(n===0) return "zero";
  const groups=[]; let x=n; while(x>0){ groups.push(x%1000); x=Math.floor(x/1000); }
  const names=[["",""],["mil","mil"],["milhão","milhões"],["bilhão","bilhões"]];
  const out=[];
  for(let i=groups.length-1;i>=0;i--){
    const g=groups[i]; if(!g) continue;
    let w;
    if(i===0) w=ate999(g, fem);
    else if(i===1) w = g===1 ? "mil" : ate999(g, fem)+" mil";
    else w = ate999(g,false)+" "+(g===1?names[i][0]:names[i][1]);
    out.push({w,g,i});
  }
  let s="";
  out.forEach((o,k)=>{
    if(k===0){ s=o.w; return; }
    const last = k===out.length-1;
    const useE = last && (o.g<100 || o.g%100===0);
    s += (useE?" e ":" ") + o.w;
  });
  return s;
}
function reaisExtenso(v){
  const cents=Math.round(v*100), r=Math.floor(cents/100), c=cents%100;
  let s="";
  if(r>0){ s=extenso(r,false); const mi = r>=1e6 && r%1e6===0; s += mi ? " de reais" : (r===1?" real":" reais"); }
  if(c>0){ s += (s?" e ":"") + extenso(c,false) + (c===1?" centavo":" centavos"); }
  return s || "zero real";
}

/* ---------- contract model ---------- */
function F(v, ph){ // marca campo preenchido
  if(v===undefined||v===null||String(v).trim()==="") return {f:true, empty:true, t:ph||"[a preencher]"};
  return {f:true, t:String(v)};
}
// Each block: {t:type, runs:[string | {f,t,empty}], label?}
function buildBlocks(){
  const s=S, o=(g)=>g==="F"?"a":"o";
  const n=noites(s.ci,s.co);
  const total=parseMoney(s.total);
  const pct=Math.max(0,Math.min(100,Number(s.pct)||0));
  const B=[];
  if(s.showLogo==="1" && logo) B.push({t:"logo"});
  B.push({t:"title", runs:["CONTRATO DE LOCAÇÃO DE IMÓVEL PARA TEMPORADA"]});

  const endImovel=(s.im_endereco||"").trim().replace(/\s*\n\s*/g," ");
  function parte(p){
    const g=s[p+"_g"];
    const items=[];
    if(s[p+"_nac"]) items.push(F(s[p+"_nac"]));
    if(s[p+"_ec"]) items.push(F(s[p+"_ec"]));
    if(s[p+"_prof"]) items.push(F(s[p+"_prof"]));
    items.push(["inscrit"+o(g)+" no CPF ", F(s[p+"_cpf"],"[CPF]")]);
    if(s[p+"_end"]) items.push(["estabelecid"+o(g)+" no endereço ", F(s[p+"_end"])]);
    const runs=[F(s[p+"_nome"], p==="loc"?"[nome do locador]":"[nome do locatário]"), " ["];
    items.forEach((it,i)=>{ if(i) runs.push(", "); if(Array.isArray(it)) runs.push(...it); else runs.push(it); });
    if(s[p+"_tel"]) runs.push("; tel.: ", F(s[p+"_tel"]));
    runs.push("]");
    return runs;
  }
  B.push({t:"intro", runs:[
    "Contrato de locação para temporada – consoante o disposto nos artigos 48 e seguintes da Lei nº 8245/91 –, do imóvel situado à ",
    F(endImovel,"[endereço do imóvel]"),
    ", que entre si fazem, de um lado como locador e do outro locatário, neste ato representado pelas pessoas físicas de ",
    ...parte("loc"), " e ", ...parte("lt"), "."
  ]});
  B.push({t:"h", runs:["OBRIGAÇÕES CONTRATUAIS"]});

  const arts=[];
  // Art 1
  const nTxt = n>0 ? `${n} (${extenso(n,true)}) ${n===1?"noite":"noites"}` : "";
  const inicio = [F(dataExtenso(s.ci),"[data de check-in]")];
  if(s.hora_ci) inicio.push(", a partir das ", F(hora(s.hora_ci)));
  arts.push(["O prazo da locação é de: ", F(nTxt,"[nº de noites]"), ", com início em ", ...inicio,
    " e término em ", F(dataExtenso(s.co),"[data de check-out]"), ", às ", F(hora(s.hora_co),"[horário]"),
    ", data em que o imóvel será devolvido, impreterivelmente, no estado estético e de conservação em que foi entregue, com todos os móveis, aparelhos e objetos que o guarnecem, devendo suas condições de uso e estéticas estarem conforme recebidos;"]);
  // Art 2
  const tOk = isFinite(total) && total>0;
  const valor = tOk ? `R$ ${fmtMoney(total)} (${reaisExtenso(total)})` : "";
  const dRest = s.data_rest || s.ci;
  const sufCheckin = (dRest && dRest===s.ci) ? " (check-in)" : "";
  let a2=["O valor do aluguel é de ", F(valor,"[valor total]"), ", cujo pagamento será feito "];
  if(pct>=100) a2.push("integralmente na data da reserva;");
  else if(pct<=0) a2.push("integralmente no dia ", F(dataExtenso(dRest),"[data]"), sufCheckin+";");
  else {
    const sinal = tOk ? Math.round(total*pct)/100 : NaN;
    const rest = tOk ? Math.round((total-sinal)*100)/100 : NaN;
    a2.push("da seguinte forma: ", F(String(pct).replace(".",",")+"%"), " do valor (", F(tOk?"R$ "+fmtMoney(sinal):"","R$ [sinal]"),
      ") na data da reserva e o valor restante (", F(tOk?"R$ "+fmtMoney(rest):"","R$ [restante]"), ") no dia ",
      F(dataExtenso(dRest),"[data]"), sufCheckin+";");
  }
  arts.push({runs:a2, pars:[
    "§ 1º A devolução do imóvel, que finda automaticamente a locação, dispensa notificação, interpelação ou aviso e independe de qualquer formalidade;",
    "§ 2º O locador por motivo próprio, poderá pedir imediatamente a posse do imóvel. A resistência dos ocupantes em devolver o imóvel configura esbulho possessório, que acarretará multa diária equivalente a 2 (duas) vezes o valor locado;",
    "§ 3º Na oportunidade referida no parágrafo anterior, o imóvel deverá estar totalmente livre de pessoas e coisas, qualquer objeto ou pertence do locatário e acompanhantes, de maneira a exonerar o locador de qualquer responsabilidade em caso de eventuais reclamações posteriores."
  ]});
  arts.push(["O locador fica desobrigado de todo e qualquer responsabilidade quanto à bagagem, objetos, joias ou outros pertences de propriedade e uso do locatário e ocupantes;"]);
  arts.push(["Fica proibido ao locatário sob qualquer pretexto, sublocar, emprestar, ceder ou transferir o imóvel, ou este contrato a terceiro. Só sendo admissível o uso do imóvel pelo locatário e seus ocupantes;"]);
  arts.push(["Fica vedada a troca do segredo da fechadura do imóvel sem autorização por escrito do locador, inclusive cópias adicionais de chaves. Sendo necessário, o locatário deverá solicitar novas cópias ao locador;"]);
  arts.push(["Fica desde já autorizado o locador a vistoriar o imóvel a qualquer tempo para verificar as respectivas condições de uso;"]);
  arts.push(["O locatário terá que cumprir integralmente a convenção de condomínio e os regulamentos internos do prédio. O não cumprimento acarretará em multa de 2 vezes o valor locado, além do valor da multa condominial e a rescisão do contrato;"]);
  arts.push(["No caso de o locatário desistir da locação antes do termo final de vigência deste contrato, não lhe serão devolvidas, ou devidas quaisquer importâncias relativas a diárias não usufruídas;"]);
  arts.push(["Obriga-se o locatário a zelar pela conservação e limpeza das paredes, portas, janelas, assoalhos, peças sanitárias do imóvel, assim como dos móveis, utensílios, equipamentos e decorações que o guarnecem, após o uso;"]);
  arts.push(["Ao receber as chaves, o locador juntamente com o locatário fará vistoria em todo o imóvel;"]);
  arts.push(["As importâncias dos valores serão pagas através de chave Pix: ", F(s.pix_tipo), ": ‘", F(s.pix_chave,"[chave Pix]"), "’ em nome de ",
    F(s.pix_titular,"[titular]"), " – ", F(s.pix_banco,"[banco]"), ";"]);
  let itens=(s.im_itens||"").trim(); if(itens && !/[;.]$/.test(itens)) itens+=";";
  arts.push(["O locatário estará recebendo o imóvel: ", F(s.im_unidade,"[unidade]"), " no endereço supramencionado possuindo: ", F(itens,"[itens do imóvel]")]);
  arts.push(["Em caso de emergência, necessidade de manutenção, consertos e outros serviços, o locatário desde já, autoriza a entrada do locador e dos seus representantes no imóvel para efetuarem o trabalho necessário;"]);
  (s.extras||"").split(/\n+/).map(x=>x.trim()).filter(Boolean).forEach(x=>{ if(!/[;.]$/.test(x)) x+=";"; arts.push([F(x)]); });
  arts.push(["Por estarem justos e acordados, as partes firmam o presente em duas vias de igual teor e forma, elegendo o Foro da cidade de ",
    F(s.foro,"[cidade]"), " para dirimir e julgar todas e quaisquer dúvidas oriundas do presente contrato, afastando eventuais privilégios por mais especiais que sejam."]);

  arts.forEach((a,i)=>{
    const runs = Array.isArray(a)? a : a.runs;
    B.push({t:"art", label:`Art. ${i+1}º`, runs});
    if(a.pars) a.pars.forEach((p,j)=>B.push({t:"par", last:j===a.pars.length-1, runs:[p]}));
  });

  B.push({t:"right", runs:[F(s.ass_local,"[local]"), ", ", F(dataExtenso(s.ass_data),"[data]"), "."]});
  B.push({t:"sign", sig:true, runs:[F(s.loc_nome,"[locador]"), " - Locador"]});
  B.push({t:"sign", runs:[F(s.lt_nome,"[locatário]"), " - Locatári"+(s.lt_g==="F"?"a":"o")]});
  return B;
}
const runText = r => typeof r==="string" ? r : r.t;
const blockText = b => (b.runs||[]).map(runText).join("");

/* ---------- preview ---------- */
function esc(s){ return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function runsHTML(runs){
  return runs.map(r=>{
    if(typeof r==="string") return esc(r);
    if(r.empty) return `<mark style="background:#ffe1d6">${esc(r.t)}</mark>`;
    return highlight ? `<mark>${esc(r.t)}</mark>` : esc(r.t);
  }).join("");
}
function renderPreview(){
  const B=buildBlocks(); let h="";
  B.forEach(b=>{
    switch(b.t){
      case "logo": h+=`<img class="logo" src="${logo}" alt="">`; break;
      case "title": h+=`<h2>${runsHTML(b.runs)}</h2>`; break;
      case "intro": h+=`<p class="intro">${runsHTML(b.runs)}</p>`; break;
      case "h": h+=`<p class="h">${runsHTML(b.runs)}</p>`; break;
      case "art": h+=`<p><span class="lab">${b.label}</span>${runsHTML(b.runs)}</p>`; break;
      case "par": h+=`<p class="par${b.last?" last":""}">${runsHTML(b.runs)}</p>`; break;
      case "right": h+=`<p class="right">${runsHTML(b.runs)}</p>`; break;
      case "sign": h+=`<div class="sign">${b.sig&&sig?`<img src="${sig.src}" alt="">`:""}<span class="ln"></span>${runsHTML(b.runs)}</div>`; break;
    }
  });
  document.getElementById("paper").innerHTML=h;
}

/* ---------- validation / calc ---------- */
function issues(){
  const s=S, out=[];
  if(!s.lt_nome.trim()) out.push("Nome do locatário");
  if(s.lt_cpf.replace(/\D/g,"").length!==11) out.push("CPF do locatário (11 dígitos)");
  if(s.loc_cpf.replace(/\D/g,"").length!==11) out.push("CPF do locador (11 dígitos) — seção Locador");
  if(!(s.im_endereco||"").trim()) out.push("Endereço do imóvel");
  if(!s.ci||!s.co) out.push("Datas de check-in e check-out");
  else if(noites(s.ci,s.co)<=0) out.push("Check-out deve ser depois do check-in");
  const t=parseMoney(s.total); if(!(t>0)) out.push("Valor total");
  return out;
}
function renderMeta(){
  const n=noites(S.ci,S.co), t=parseMoney(S.total), pct=Math.max(0,Math.min(100,Number(S.pct)||0));
  let c=`<b>${n>0?n:"—"}</b> ${n===1?"noite":"noites"}`;
  if(t>0){
    c+=` · total <b>R$ ${fmtMoney(t)}</b>`;
    if(n>0) c+=` · média <b>R$ ${fmtMoney(t/n)}</b>/noite`;
    if(pct>0&&pct<100){ const si=Math.round(t*pct)/100; c+=`<br>Sinal ${pct}%: <b>R$ ${fmtMoney(si)}</b> · restante: <b>R$ ${fmtMoney(t-si)}</b>`; }
    c+=`<br><span class="muted">${reaisExtenso(t)}</span>`;
  }
  document.getElementById("calc").innerHTML=c;
  const iss=issues(), el=document.getElementById("issues");
  if(iss.length){ el.className="issues"; el.innerHTML="<b>Falta preencher:</b><ul>"+iss.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul>"; }
  else { el.className="issues ok"; el.innerHTML="Tudo preenchido — pronto para gerar."; }
  document.getElementById("imHint").textContent = S.im_cond || "";
}

/* ---------- form binding ---------- */
const inputs=[...document.querySelectorAll("[data-k]")];
function fillForm(){ inputs.forEach(el=>{ const k=el.dataset.k; el.value = S[k] ?? ""; }); }
function persist(){
  store.set("draft", S);
  const prof={}; PROFILE_KEYS.forEach(k=>prof[k]=S[k]); store.set("profile", prof);
}
let tmr;
function update(){ renderMeta(); renderPreview(); clearTimeout(tmr); tmr=setTimeout(persist,300); }
inputs.forEach(el=>{
  el.addEventListener("input",()=>{
    const k=el.dataset.k;
    if(el.dataset.mask==="cpf"){ const p=el.selectionStart, before=el.value.length; el.value=fmtCPF(el.value); try{ el.setSelectionRange(p+(el.value.length-before),p+(el.value.length-before)); }catch(e){} }
    S[k]=el.value;
    const n=noites(S.ci,S.co);
    if(k==="diaria"){ const d=parseMoney(S.diaria); if(d>0&&n>0){ S.total=fmtMoney(d*n); setVal("total",S.total); } }
    else if(k==="total"){ const t=parseMoney(S.total); if(t>0&&n>0){ S.diaria=fmtMoney(t/n); setVal("diaria",S.diaria); } }
    else if(k==="ci"||k==="co"){ const d=parseMoney(S.diaria); if(d>0&&n>0){ S.total=fmtMoney(d*n); setVal("total",S.total); } }
    update();
  });
  if(el.hasAttribute("data-money")) el.addEventListener("blur",()=>{ const v=parseMoney(el.value); if(isFinite(v)&&el.value.trim()){ el.value=fmtMoney(v); S[el.dataset.k]=el.value; update(); } });
});
function setVal(k,v){ const el=document.querySelector(`[data-k="${k}"]`); if(el && document.activeElement!==el) el.value=v; }

/* ---------- modal ---------- */
function ask(title, body, def){
  return new Promise(res=>{
    const m=document.getElementById("modal"), inp=document.getElementById("mInput");
    document.getElementById("mTitle").textContent=title; document.getElementById("mBody").textContent=body;
    inp.hidden = def===null; inp.value=def||""; m.classList.add("show"); if(def!==null) setTimeout(()=>inp.focus(),30);
    const done=v=>{ m.classList.remove("show"); ok.onclick=cancel.onclick=inp.onkeydown=null; res(v); };
    const ok=document.getElementById("mOk"), cancel=document.getElementById("mCancel");
    ok.onclick=()=>done(def===null? true : inp.value.trim()); cancel.onclick=()=>done(null);
    inp.onkeydown=e=>{ if(e.key==="Enter") ok.onclick(); if(e.key==="Escape") cancel.onclick(); };
  });
}
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2600); }

/* ---------- images ---------- */
function readImage(file){
  return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>{ const im=new Image(); im.onload=()=>{
      // normalize to PNG, limit size
      const max=900, sc=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));
      const c=document.createElement("canvas"); c.width=Math.round(im.naturalWidth*sc); c.height=Math.round(im.naturalHeight*sc);
      c.getContext("2d").drawImage(im,0,0,c.width,c.height); res({src:c.toDataURL("image/png"),w:c.width,h:c.height}); };
    im.onerror=rej; im.src=fr.result; }; fr.onerror=rej; fr.readAsDataURL(file); });
}
function renderImgs(){
  { const lt=document.getElementById("logoThumb"); lt.hidden=!logo; if(logo) lt.src=logo; }
  const st=document.getElementById("sigThumb"), sd=document.getElementById("sigDel");
  if(sig){ st.src=sig.src; st.hidden=false; sd.hidden=false; } else { st.hidden=true; sd.hidden=true; }
}

document.getElementById("logoReset").addEventListener("click",()=>{ logo=DEFAULT_LOGO; store.del("logo"); renderImgs(); update(); });

document.getElementById("sigDel").addEventListener("click",()=>{ sig=null; store.del("sig"); renderImgs(); update(); });

/* ---------- copiar ---------- */
function plainText(){
  return buildBlocks().filter(b=>b.t!=="logo").map(b=>{
    if(b.t==="art") return b.label+"\t"+blockText(b);
    if(b.t==="sign") return "\n\n_______________________________\n"+blockText(b);
    return blockText(b);
  }).join("\n\n");
}
document.getElementById("btnCopiar").addEventListener("click",async()=>{
  try{ await navigator.clipboard.writeText(plainText()); toast("Texto copiado"); }catch(e){ toast("Não foi possível copiar neste navegador"); }
});

/* ---------- file name & saving ---------- */
function fileBase(){
  const n=(S.im_cond||"IMOVEL").toUpperCase().replace(/[\\/:*?"<>|]/g,"");
  const a=parseISO(S.ci), b=parseISO(S.co);
  let p=""; if(a&&b) p=` - ${dataCurta(S.ci)} ${dataCurta(S.co)} ${b.y}`;
  return `CONTRATO ${n}${p}`;
}
let downloadsNS=null;
if(window.claude && typeof window.claude.use==="function"){ window.claude.use("downloads").then(d=>{downloadsNS=d;}).catch(()=>{}); }
async function saveFile(filename, blob){
  if(downloadsNS){
    try{ await downloadsNS.save({filename, data:blob}); toast("Arquivo salvo"); return; }
    catch(e){ if(e && e.code==="declined") return; if(e && e.code==="rate_limited"){ toast("Aguarde um instante e tente de novo"); return; } }
  }
  try{
    const url=URL.createObjectURL(blob), a=document.createElement("a");
    a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000);

}
function confirmIssues(){
  const iss=issues(); if(!iss.length) return Promise.resolve(true);
  return ask("Campos pendentes","Ainda falta: "+iss.join("; ")+". Gerar mesmo assim?",null).then(v=>v!==null);
}

/* ---------- DOCX (zip writer, no libs) ---------- */
const CRC_T=(()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();
function crc32(u8){ let c=0xFFFFFFFF; for(let i=0;i<u8.length;i++) c=CRC_T[(c^u8[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function zip(files){ // files: [{name, data:Uint8Array}] stored (no compression)
  const enc=new TextEncoder(), chunks=[], central=[]; let off=0;
  files.forEach(f=>{
    const name=enc.encode(f.name), d=f.data, crc=crc32(d);
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,0x0800,true); h.setUint16(8,0,true);
    h.setUint16(10,0,true); h.setUint16(12,0x21,true); h.setUint32(14,crc,true); h.setUint32(18,d.length,true); h.setUint32(22,d.length,true);
    h.setUint16(26,name.length,true); h.setUint16(28,0,true);
    chunks.push(new Uint8Array(h.buffer),name,d);
    const c=new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint16(8,0x0800,true); c.setUint16(10,0,true);
    c.setUint16(12,0,true); c.setUint16(14,0x21,true); c.setUint32(16,crc,true); c.setUint32(20,d.length,true); c.setUint32(24,d.length,true);
    c.setUint16(28,name.length,true); c.setUint16(30,0,true); c.setUint16(32,0,true); c.setUint16(34,0,true); c.setUint16(36,0,true);
    c.setUint32(38,0,true); c.setUint32(42,off,true);
    central.push(new Uint8Array(c.buffer),name);
    off += 30+name.length+d.length;
  });
  const cdSize=central.reduce((a,b)=>a+b.length,0);
  const e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true); e.setUint16(8,files.length,true); e.setUint16(10,files.length,true);
  e.setUint32(12,cdSize,true); e.setUint32(16,off,true);
  return new Blob([...chunks,...central,new Uint8Array(e.buffer)],{type:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
}
function b64ToU8(dataURL){ const b=atob(dataURL.split(",")[1]); const u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }

function xesc(s){ return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function wRun(t){ return `<w:r><w:t xml:space="preserve">${xesc(t)}</w:t></w:r>`; }
function wDrawing(rid, id, cx, cy){
  return `<w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="${cx}" cy="${cy}"/><wp:docPr id="${id}" name="Imagem ${id}"/><a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="${id}" name="img${id}.png"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="${rid}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r>`;
}
async function buildDocx(){
  const B=buildBlocks(); const EMU=360000; // per cm
  const P=(inner,{jc="both",after=200,before=0,ind="",tabs="",keep=false}={})=>
    `<w:p><w:pPr>${keep?'<w:keepNext/>':''}${tabs}<w:spacing w:before="${before}" w:after="${after}" w:line="276" w:lineRule="auto"/>${ind}<w:jc w:val="${jc}"/></w:pPr>${inner}</w:p>`;
  let body="";
  const media=[];
  for(const b of B){
    const txt=blockText(b);
    switch(b.t){
      case "logo": { const d=await imgDims(logo); const w=2.6*EMU, h=Math.round(w*d.h/d.w); media.push({rid:"rIdLogo",name:"logo.png",data:b64ToU8(logo)});
        body+=P(wDrawing("rIdLogo",1,Math.round(w),h),{jc:"center",after:120}); break; }
      case "title": body+=P(`<w:r><w:rPr><w:sz w:val="26"/></w:rPr><w:t xml:space="preserve">${xesc(txt)}</w:t></w:r>`,{jc:"center",after:360}); break;
      case "intro": body+=P(wRun(txt),{ind:'<w:ind w:firstLine="1134"/>'}); break;
      case "h": body+=P(wRun(txt),{jc:"left",keep:true}); break;
      case "art": body+=P(wRun(b.label)+"<w:r><w:tab/></w:r>"+wRun(txt),{tabs:'<w:tabs><w:tab w:val="left" w:pos="1418"/></w:tabs>'}); break;
      case "par": body+=P(wRun(txt),{after:b.last?200:0}); break;
      case "right": body+=P(wRun(txt),{jc:"right",after:240,keep:true}); break;
      case "sign": {
        let inner="";
        if(b.sig && sig){ const w=Math.min(6.5, 2.2*sig.w/sig.h)*EMU, h=Math.round(w*sig.h/sig.w); media.push({rid:"rIdSig",name:"assinatura.png",data:b64ToU8(sig.src)});
          body+=P(wDrawing("rIdSig",2,Math.round(w),h),{jc:"center",before:240,after:0,keep:true}); }
        else body+=P("",{jc:"center",before:360,after:0,keep:true});
        body+=P(wRun("________________________________________"),{jc:"center",after:0,keep:true});
        body+=P(wRun(txt),{jc:"center",after:120}); break; }
    }
  }
  const sect=`<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1418" w:header="709" w:footer="709" w:gutter="0"/></w:sectPr>`;
  const doc=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing"><w:body>${body}${sect}</w:body></w:document>`;
  const styles=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:eastAsia="Times New Roman" w:cs="Times New Roman"/><w:sz w:val="24"/><w:szCs w:val="24"/><w:lang w:val="pt-BR"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="0" w:line="276" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style></w:styles>`;
  const rels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rIdStyles" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>${media.map(m=>`<Relationship Id="${m.rid}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/${m.name}"/>`).join("")}</Relationships>`;
  const ct=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="png" ContentType="image/png"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>`;
  const root=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`;
  const enc=new TextEncoder();
  return zip([
    {name:"[Content_Types].xml",data:enc.encode(ct)},
    {name:"_rels/.rels",data:enc.encode(root)},
    {name:"word/document.xml",data:enc.encode(doc)},
    {name:"word/styles.xml",data:enc.encode(styles)},
    {name:"word/_rels/document.xml.rels",data:enc.encode(rels)},
    ...media.map(m=>({name:"word/media/"+m.name,data:m.data}))
  ]);
}

/* ---------- PDF (gerador próprio, Times-Roman, sem bibliotecas) ---------- */
const TW=[250,333,408,500,500,833,778,180,333,333,500,564,250,333,250,278,500,500,500,500,500,500,500,500,500,500,278,278,564,564,564,444,921,722,667,667,722,611,556,722,722,333,389,722,611,889,722,722,556,722,667,556,611,722,722,944,722,722,611,333,278,333,469,500,333,444,500,444,500,444,333,500,500,278,278,500,278,778,500,500,500,500,333,389,278,500,500,722,500,500,444,480,200,480,541,0,500,0,333,500,444,1000,500,500,333,1000,556,333,889,0,611,0,0,333,333,444,444,350,500,1000,333,980,389,333,722,0,444,722,250,333,500,500,500,500,200,500,333,760,276,500,564,333,760,500,400,549,300,300,333,576,453,333,333,300,310,500,750,750,750,444,722,722,722,722,722,722,889,667,611,611,611,611,333,333,333,333,722,722,722,722,722,722,722,564,722,722,722,722,722,722,556,500,444,444,444,444,444,444,667,444,444,444,444,444,278,278,278,278,500,500,500,500,500,500,500,549,500,500,500,500,500,500,500,500]; // larguras WinAnsi 32..255 (1/1000 em)
const CP1252={0x20AC:0x80,0x201A:0x82,0x0192:0x83,0x201E:0x84,0x2026:0x85,0x2020:0x86,0x2021:0x87,0x02C6:0x88,0x2030:0x89,0x0160:0x8A,0x2039:0x8B,0x0152:0x8C,0x017D:0x8E,0x2018:0x91,0x2019:0x92,0x201C:0x93,0x201D:0x94,0x2022:0x95,0x2013:0x96,0x2014:0x97,0x02DC:0x98,0x2122:0x99,0x0161:0x9A,0x203A:0x9B,0x0153:0x9C,0x017E:0x9E,0x0178:0x9F};
function winAnsi(ch){ const c=ch.codePointAt(0); if(c>=32&&c<127) return c; if(c>=0xA0&&c<=0xFF) return c; return CP1252[c]||63; }
const MM2PT=72/25.4;
class MiniPDF{
  constructor(){ this.pages=[]; this.images=[]; this.fs=12; this.PH=297; this.PW=210; this.addPage(); }
  addPage(){ this.cur=[]; this.pages.push(this.cur); }
  setFontSize(s){ this.fs=s; }
  getTextWidth(s){ let w=0; for(const ch of s){ const c=winAnsi(ch); w+=TW[c-32]||500; } return w*this.fs/1000/MM2PT; }
  enc(s){ let o=""; for(const ch of s){ const c=winAnsi(ch); if(c===40||c===41||c===92) o+="\\"+String.fromCharCode(c); else if(c>126) o+="\\"+c.toString(8).padStart(3,"0"); else o+=String.fromCharCode(c); } return o; }
  text(s,x,y,opt={}){ const w=this.getTextWidth(s); if(opt.align==="center") x-=w/2; else if(opt.align==="right") x-=w;
    this.cur.push(`BT /F1 ${this.fs} Tf ${(x*MM2PT).toFixed(2)} ${((this.PH-y)*MM2PT).toFixed(2)} Td (${this.enc(s)}) Tj ET`); }
  line(x1,y1,x2,y2,lw=0.25){ this.cur.push(`${(lw*MM2PT).toFixed(2)} w ${(x1*MM2PT).toFixed(2)} ${((this.PH-y1)*MM2PT).toFixed(2)} m ${(x2*MM2PT).toFixed(2)} ${((this.PH-y2)*MM2PT).toFixed(2)} l S`); }
  image(img,x,y,w,h){ let i=this.images.indexOf(img); if(i<0){ this.images.push(img); i=this.images.length-1; }
    this.cur.push(`q ${(w*MM2PT).toFixed(2)} 0 0 ${(h*MM2PT).toFixed(2)} ${(x*MM2PT).toFixed(2)} ${((this.PH-y-h)*MM2PT).toFixed(2)} cm /Im${i} Do Q`); }
  output(){
    const enc=new TextEncoder(), parts=[], offs=[]; let len=0;
    const push=u=>{ parts.push(u); len+=u.length; };
    const objs=[]; // each: array of (string|Uint8Array)
    const nImg=this.images.length, nPg=this.pages.length;
    const fontId=3, imgId=i=>4+i, pageId=i=>4+nImg+2*i, contId=i=>5+nImg+2*i;
    objs[1]=["<< /Type /Catalog /Pages 2 0 R >>"];
    objs[2]=[`<< /Type /Pages /Kids [${this.pages.map((_,i)=>pageId(i)+" 0 R").join(" ")}] /Count ${nPg} >>`];
    objs[3]=["<< /Type /Font /Subtype /Type1 /BaseFont /Times-Roman /Encoding /WinAnsiEncoding >>"];
    this.images.forEach((im,i)=>{ objs[imgId(i)]=[`<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.data.length} >>\nstream\n`, im.data, "\nendstream"]; });
    const xo=this.images.map((_,i)=>`/Im${i} ${imgId(i)} 0 R`).join(" ");
    this.pages.forEach((pg,i)=>{
      const c=enc.encode(pg.join("\n"));
      objs[pageId(i)]=[`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${(this.PW*MM2PT).toFixed(2)} ${(this.PH*MM2PT).toFixed(2)}] /Resources << /Font << /F1 ${fontId} 0 R >> /XObject << ${xo} >> >> /Contents ${contId(i)} 0 R >>`];
      objs[contId(i)]=[`<< /Length ${c.length} >>\nstream\n`, c, "\nendstream"];
    });
    push(enc.encode("%PDF-1.4\n%\xE2\xE3\xCF\xD3\n"));
    for(let n=1;n<objs.length;n++){ offs[n]=len; push(enc.encode(`${n} 0 obj\n`)); objs[n].forEach(x=>push(typeof x==="string"?enc.encode(x):x)); push(enc.encode("\nendobj\n")); }
    const xref=len; let x=`xref\n0 ${objs.length}\n0000000000 65535 f \n`;
    for(let n=1;n<objs.length;n++) x+=String(offs[n]).padStart(10,"0")+" 00000 n \n";
    x+=`trailer\n<< /Size ${objs.length} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
    push(enc.encode(x));
    return new Blob(parts,{type:"application/pdf"});
  }
}
function toJpeg(dataURL){
  return new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>{ const c=document.createElement("canvas"); c.width=im.naturalWidth; c.height=im.naturalHeight;
    const g=c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,c.width,c.height); g.drawImage(im,0,0);
    res({w:c.width,h:c.height,data:b64ToU8(c.toDataURL("image/jpeg",0.92))}); }; im.onerror=rej; im.src=dataURL; });
}
async function buildPdf(){
  const doc=new MiniPDF();
  const PW=210, PH=297, L=25, R=20, T=20, BOT=20, W=PW-L-R, FS=12, LH=5.6, GAP=4.2, TAB=25;
  doc.setFontSize(FS);
  let y=T+4;
  const ensure=h=>{ if(y+h>PH-BOT){ doc.addPage(); y=T+4; } };
  const sp=()=>doc.getTextWidth(" ");
  function wrap(text, firstW, w){
    const words=text.split(/\s+/).filter(Boolean), lines=[]; let cur=[], curW=0, lim=firstW;
    words.forEach(wd=>{ const ww=doc.getTextWidth(wd); const add = cur.length? sp()+ww : ww;
      if(cur.length && curW+add>lim){ lines.push(cur); cur=[wd]; curW=ww; lim=w; } else { cur.push(wd); curW+=add; } });
    if(cur.length) lines.push(cur); return lines;
  }
  function drawLine(words, x, w, justify){
    if(!justify || words.length<2){ doc.text(words.join(" "), x, y); return; }
    const tot=words.reduce((a,wd)=>a+doc.getTextWidth(wd),0), g=(w-tot)/(words.length-1);
    let cx=x; words.forEach(wd=>{ doc.text(wd,cx,y); cx+=doc.getTextWidth(wd)+g; });
  }
  function para(text,{first=0,label=null,align="justify",after=GAP}={}){
    const lines=wrap(text, W-first, W);
    lines.forEach((ln,i)=>{
      ensure(LH);
      if(i===0 && label) doc.text(label, L, y);
      const x = i===0 ? L+first : L, w = i===0 ? W-first : W;
      if(align==="center") doc.text(ln.join(" "), PW/2, y, {align:"center"});
      else if(align==="right") doc.text(ln.join(" "), PW-R, y, {align:"right"});
      else if(align==="left") doc.text(ln.join(" "), x, y);
      else drawLine(ln, x, w, i<lines.length-1);
      y+=LH;
    });
    y+=after;
  }
  const B=buildBlocks();
  for(const b of B){
    const txt=blockText(b);
    switch(b.t){
      case "logo": { const im=await toJpeg(logo); const w=24, h=w*im.h/im.w; doc.image(im,(PW-w)/2,y-4,w,h); y+=h+2; break; }
      case "title": doc.setFontSize(13); y+=2; para(txt,{align:"center",after:GAP+2}); doc.setFontSize(FS); break;
      case "intro": para(txt,{first:12.5}); break;
      case "h": ensure(LH*3); para(txt,{align:"left"}); break;
      case "art": para(txt,{first:TAB,label:b.label}); break;
      case "par": para(txt,{after:b.last?GAP:0}); break;
      case "right": ensure(LH*9); para(txt,{align:"right",after:2}); break;
      case "sign": {
        const sh = (b.sig&&sig)? 18 : 0;
        ensure(12+sh+LH*2); y+=10;
        if(sh){ const im=await toJpeg(sig.src); const w=Math.min(65, sh*im.w/im.h), h=w*im.h/im.w; doc.image(im,(PW-w)/2,y-h+3,w,h); }
        doc.line(PW/2-45,y,PW/2+45,y); y+=LH;
        para(txt,{align:"center",after:2}); break; }
    }
  }
  return doc.output();
}
document.getElementById("btnPdf").addEventListener("click",async()=>{
  if(!(await confirmIssues())) return;
  let blob; try{ blob=await buildPdf(); }catch(e){ console.error(e); toast("Erro ao gerar o PDF"); return; }
  await saveFile(fileBase()+".pdf", blob);
});
